    .plan-wrap{padding:16px 0 32px}
    .plan-form{background:var(--white);border-radius:var(--radius-lg);box-shadow:var(--shadow);padding:20px;margin-bottom:16px}
    .plan-input-group{position:relative;margin-bottom:12px}
    .plan-input-group:last-child{margin-bottom:0}
    .plan-label{font-size:.78rem;font-weight:700;color:var(--gray-500);margin-bottom:6px;display:flex;align-items:center;gap:6px}
    .plan-label-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
    .plan-label-dot.start{background:var(--green)}
    .plan-label-dot.end{background:var(--red)}
    .plan-input{width:100%;padding:12px 14px;border:2px solid var(--gray-200);border-radius:var(--radius-sm);font-family:inherit;font-size:15px;color:var(--gray-800);background:var(--gray-50);outline:none;transition:border-color .25s,background .25s}
    .plan-input:focus{border-color:var(--kraft);background:var(--white)}
    .plan-input::placeholder{color:var(--gray-400)}
    .plan-swap{display:flex;justify-content:center;margin:-4px 0;position:relative;z-index:1}
    .plan-swap-btn{background:var(--white);border:2px solid var(--gray-200);border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1rem;color:var(--gray-500);transition:all .25s;box-shadow:var(--shadow-sm)}
    .plan-swap-btn:hover{border-color:var(--kraft);color:var(--kraft-dark);transform:rotate(180deg)}
    .plan-go{width:100%;margin-top:16px;padding:14px;background:var(--blue);color:var(--white);border:none;border-radius:var(--radius-sm);font-family:inherit;font-size:1rem;font-weight:700;cursor:pointer;transition:background .25s,transform .25s;min-height:48px}
    .plan-go:hover{background:var(--blue-dark)}
    .plan-go:active{transform:scale(.98)}
    .plan-suggestions{position:absolute;top:100%;left:0;right:0;background:var(--white);border:1px solid var(--gray-200);border-radius:var(--radius-sm);box-shadow:var(--shadow-lg);max-height:220px;overflow-y:auto;z-index:100;display:none}
    .plan-suggestions.show{display:block}
    .plan-sug-item{padding:10px 14px;cursor:pointer;font-size:.88rem;border-bottom:1px solid var(--gray-100);transition:background .25s;display:flex;justify-content:space-between;align-items:center}
    .plan-sug-item:hover{background:var(--kraft-bg2)}
    .plan-sug-item:last-child{border-bottom:none}
    .plan-sug-name{font-weight:500;color:var(--gray-800)}
    .plan-sug-routes{display:flex;gap:3px;flex-wrap:wrap;justify-content:flex-end}
    .plan-sug-route{font-size:.65rem;padding:1px 6px;border-radius:var(--radius-full);background:var(--green-light);color:var(--green-dark);font-weight:600}
    .plan-results{display:flex;flex-direction:column;gap:12px}
    .plan-result-card{background:var(--white);border-radius:var(--radius-lg);box-shadow:var(--shadow);overflow:hidden;border:1px solid rgba(0,0,0,.04)}
    .plan-result-header{padding:14px 16px 10px;display:flex;justify-content:space-between;align-items:center}
    .plan-result-badge{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;font-weight:700;padding:4px 10px;border-radius:var(--radius-full)}
    .plan-result-badge.direct{background:var(--green-light);color:var(--green-dark)}
    .plan-result-badge.transfer{background:#fef3c7;color:#b45309}
    .plan-result-stops{font-size:.78rem;color:var(--gray-500)}
    .plan-segment{padding:0 16px 12px}
    .plan-segment-route{display:inline-flex;align-items:center;gap:6px;font-size:1.1rem;font-weight:800;color:var(--blue);margin-bottom:6px}
    .plan-segment-dir{font-size:.72rem;color:var(--gray-400);font-weight:500}
    .plan-segment-stops{display:flex;flex-direction:column;gap:0;position:relative;padding-left:16px}
    .plan-segment-stops::before{content:'';position:absolute;left:5px;top:8px;bottom:8px;width:2px;background:var(--gray-200)}
    .plan-stop{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:.82rem;position:relative}
    .plan-stop-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;background:var(--gray-300);border:2px solid var(--white);z-index:1}
    .plan-stop-dot.on{background:var(--blue)}
    .plan-stop-dot.end-dot{background:var(--green)}
    .plan-stop-dot.dest-dot{background:var(--red)}
    .plan-stop-name{color:var(--gray-700);font-weight:500}
    .plan-stop-name.highlight{color:var(--gray-900);font-weight:700}
    .plan-separator{display:flex;align-items:center;gap:8px;padding:8px 16px;font-size:.78rem;color:var(--amber);font-weight:600}
    .plan-separator-line{flex:1;height:1px;background:var(--gray-200)}
    .plan-result-link{display:block;padding:10px 16px;border-top:1px solid var(--gray-100);text-align:right}
    .plan-result-link a{font-size:.82rem;font-weight:600;color:var(--blue)}
    .plan-empty{text-align:center;padding:40px 20px;color:var(--gray-400)}
    .plan-empty-icon{font-size:2.5rem;margin-bottom:12px}
    .plan-empty-text{font-size:.95rem;line-height:1.6}
    .plan-loading{text-align:center;padding:40px 0;color:var(--gray-500);font-size:.95rem}
    .plan-tip{background:var(--kraft-bg2);border-radius:var(--radius);padding:14px 16px;margin-bottom:16px;font-size:.82rem;color:var(--gray-600);line-height:1.6}
    .plan-tip strong{color:var(--gray-700)}
    @media(max-width:480px){.plan-form{padding:16px}.plan-segment{padding:0 12px 10px}.plan-result-header{padding:12px}}

  <script>
  (function() {
    var stopsData = null;
    var graph = null;
    var mtrData = null;

    function esc(s) {
      if (!s) return '';
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    Promise.all([
      fetch('data/bus-stops-index.json').then(function(r){return r.json();}),
      fetch('data/bus-routes-index.json').then(function(r){return r.json();}),
      fetch('data/mtr-stations.json').then(function(r){return r.json();})
    ]).then(function(d) {
      stopsData = d[0];
      mtrData = d[2];
      graph = RoutePlanner.buildGraph(d[1], stopsData, mtrData);
    });

    document.getElementById('plan-swap').addEventListener('click', function() {
      var s = document.getElementById('plan-start');
      var e = document.getElementById('plan-end');
      var tmp = s.value; s.value = e.value; e.value = tmp;
    });

    document.getElementById('plan-go').addEventListener('click', doSearch);
    document.getElementById('plan-start').addEventListener('keydown', function(e) { if (e.key === 'Enter') { e.preventDefault(); doSearch(); } });
    document.getElementById('plan-end').addEventListener('keydown', function(e) { if (e.key === 'Enter') { e.preventDefault(); doSearch(); } });

    function doSearch() {
      if (!graph || !stopsData || !mtrData) { alert('資料載入中，請稍後...'); return; }
      var startQ = document.getElementById('plan-start').value.trim();
      var endQ = document.getElementById('plan-end').value.trim();
      if (!startQ || !endQ) { alert('請輸入出發地和目的地'); return; }

      var startIds = [];
      var startNames = [];
      var busMatches = RoutePlanner.findStops(startQ, stopsData);
      busMatches.slice(0, 8).forEach(function(m) { startIds.push(m.id); startNames.push(RoutePlanner.stripCode(m.name_tc)); });
      var mtrMatches = RoutePlanner.findMTRStations(startQ, mtrData);
      mtrMatches.forEach(function(m) { startIds.push('mtr_' + m.name); startNames.push(m.name + ' 站'); });

      var endIds = [];
      var endNames = [];
      var busMatches2 = RoutePlanner.findStops(endQ, stopsData);
      busMatches2.slice(0, 8).forEach(function(m) { endIds.push(m.id); endNames.push(RoutePlanner.stripCode(m.name_tc)); });
      var mtrMatches2 = RoutePlanner.findMTRStations(endQ, mtrData);
      mtrMatches2.forEach(function(m) { endIds.push('mtr_' + m.name); endNames.push(m.name + ' 站'); });

      if (startIds.length === 0 || endIds.length === 0) {
        document.getElementById('plan-results').innerHTML =
          '<div class="plan-empty"><div class="plan-empty-icon">&#x1f50d;</div><div class="plan-empty-text">找不到符合的地點。<br>請嘗試其他關鍵字，例如地區名、巴士站名或地鐵站名。</div></div>';
        return;
      }

      document.getElementById('plan-results').innerHTML = '<div class="plan-loading">&#x1f504; 搜尋中...</div>';

      setTimeout(function() {
        var rawResults = RoutePlanner.findAllRoutes(startIds, endIds, graph);
        renderResults(rawResults, startNames.slice(0,3), endNames.slice(0,3));
      }, 50);
    }

    function renderResults(rawResults, startNames, endNames) {
      var container = document.getElementById('plan-results');
      if (!rawResults || rawResults.length === 0) {
        container.innerHTML = '<div class="plan-empty"><div class="plan-empty-icon">&#x1f68c;</div><div class="plan-empty-text">找不到合適的路線。<br>請嘗試其他關鍵字，或查看<a href="routes.html">路線目錄</a>。</div></div>';
        return;
      }

      var html = '';
      for (var i = 0; i < rawResults.length; i++) {
        var result = rawResults[i];
        var formatted = RoutePlanner.formatResult(result);
        var hasBus = false, hasMTR = false;
        formatted.segments.forEach(function(s) { if (s.type === 'bus') hasBus = true; if (s.type === 'mtr') hasMTR = true; });
        var badgeText, badgeClass;
        if (!hasMTR) { badgeText = '&#x1f68c; 巴士'; badgeClass = 'direct'; }
        else if (!hasBus) { badgeText = '&#x1f687; 地鐵'; badgeClass = 'transfer'; }
        else { badgeText = '&#x1f68c;&#x1f687; 巴士+地鐵'; badgeClass = 'transfer'; }

        html += '<div class="plan-result-card">';
        html += '<div class="plan-result-header">';
        html += '<span class="plan-result-badge ' + badgeClass + '">' + badgeText + '</span>';
        html += '<span class="plan-result-stops">' + formatted.segments.length + ' 段</span>';
        html += '</div>';

        for (var j = 0; j < formatted.segments.length; j++) {
          var seg = formatted.segments[j];
          if (j > 0) {
            html += '<div class="plan-separator"><span class="plan-separator-line"></span>&#x1f504; 轉乘<span class="plan-separator-line"></span></div>';
          }
          html += '<div class="plan-segment">';
          if (seg.type === 'bus') {
            html += '<div class="plan-segment-route">&#x1f68c; ' + esc(seg.route) + '</div>';
          } else if (seg.type === 'mtr') {
            html += '<div class="plan-segment-route">&#x1f687; ' + esc(seg.route) + '線</div>';
          } else if (seg.type === 'transfer' || seg.type === 'walk') {
            html += '<div class="plan-segment-route">&#x1f6b6; 步行</div>';
          }
          html += '<div class="plan-segment-stops">';
          for (var k = 0; k < seg.stops.length; k++) {
            var stop = seg.stops[k];
            var dotClass = '';
            var nameClass = '';
            if (k === 0) { dotClass = 'on'; nameClass = 'highlight'; }
            else if (k === seg.stops.length - 1) { dotClass = j === formatted.segments.length - 1 ? 'dest-dot' : 'end-dot'; nameClass = 'highlight'; }
            var icon = seg.type === 'mtr' ? '&#x1f687; ' : '';
            html += '<div class="plan-stop"><span class="plan-stop-dot ' + dotClass + '"></span><span class="plan-stop-name ' + nameClass + '">' + icon + esc(stop.name) + '</span></div>';
          }
          html += '</div></div>';
        }
        html += '</div>';
      }
      container.innerHTML = html;
    }
  })();
  </script>
