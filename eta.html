.eta-route-info{background:var(--white);border-radius:var(--radius-lg);box-shadow:var(--shadow);padding:20px;margin-bottom:16px;text-align:center}

.eta-direction-toggle{display:flex;gap:8px;margin:12px 0}

.eta-typeahead{position:relative;margin-bottom:16px}

<script>
(function() {
  'use strict';

  var allRoutes = [];
  var currentRoute = null;
  var currentBound = 'O';
  var refreshTimer = null;
  var searchHistory = JSON.parse(localStorage.getItem('eta_search_history') || '[]');
  var pinnedRoutes = JSON.parse(localStorage.getItem('eta_pinned_routes') || '[]');

  var searchInput = document.getElementById('eta-search-input');
  var suggestions = document.getElementById('eta-suggestions');
  var clearBtn = document.getElementById('eta-search-clear');
  var etaContent = document.getElementById('eta-content');
  var etaEmpty = document.getElementById('eta-empty');
  var etaStopList = document.getElementById('eta-stop-list');
  var etaRouteNumber = document.getElementById('eta-route-number');
  var etaRouteDir = document.getElementById('eta-route-dir');
  var etaStopsCount = document.getElementById('eta-stops-count');
  var etaDirToggle = document.getElementById('eta-direction-toggle');
  var etaRefreshTimestamp = document.getElementById('eta-refresh-timestamp');

  function esc(s) {
    if (!s) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  function renderSuggestionItems(items, showRemove) {
    return items.slice(0, 10).map(function(route) {
      var r = allRoutes.filter(function(x) { return x.route === route; })[0];
      if (!r) return '';
      var dir = (r.orig_tc || '') + ' → ' + (r.dest_tc || '');
      var removeBtn = showRemove ? '<span class="eta-history-remove" onclick="event.stopPropagation();removeHistory(\'' + esc(route) + '\')">✕</span>' : '';
      return '<div class="eta-typeahead-sug" onclick="selectRoute(\'' + esc(r.route) + '\')">' +
        '<span><span class="eta-typeahead-sug-num">' + esc(r.route) + '</span><br><span class="eta-typeahead-sug-dir">' + esc(dir) + '</span></span>' +
        '<span class="route-badge ' + ((r.company || 'KMB') === 'KMB' ? 'kmb' : 'lwb') + '">' + (r.company || 'KMB') + '</span>' + removeBtn +
      '</div>';
    }).join('');
  }

  window.removeHistory = function(route) {
    searchHistory = searchHistory.filter(function(r) { return r !== route; });
    try { localStorage.setItem('eta_search_history', JSON.stringify(searchHistory)); } catch(e) {}
    handleSearchInput(searchInput.value);
  };

  function showHistory() {
    if (searchHistory.length === 0) return;
    suggestions.innerHTML = '<div class="eta-typeahead-history-header">最近查詢</div>' + renderSuggestionItems(searchHistory, true);
    suggestions.classList.add('show');
  }

  function handleSearchInput(val) {
    clearBtn.style.display = val ? '' : 'none';
    if (!val.trim()) { showHistory(); return; }
    var q = val.trim().toLowerCase();
    var matches = [];
    var seen = {};
    allRoutes.forEach(function(r) {
      if (r.route.toLowerCase().indexOf(q) !== -1 && !seen[r.route]) {
        seen[r.route] = true;
        matches.push(r);
      }
    });
    if (matches.length === 0) { suggestions.classList.remove('show'); return; }
    // Mix history matches at top
    var histMatches = searchHistory.filter(function(h) { return h.toLowerCase().indexOf(q) !== -1; });
    var histHtml = histMatches.length > 0
      ? '<div class="eta-typeahead-history-header">最近查詢</div>' + renderSuggestionItems(histMatches, true)
      : '';
    var sugHtml = matches.slice(0, 10).map(function(r) {
      var dir = (r.orig_tc || '') + ' → ' + (r.dest_tc || '');
      return '<div class="eta-typeahead-sug" onclick="selectRoute(\'' + esc(r.route) + '\')">' +
        '<span><span class="eta-typeahead-sug-num">' + esc(r.route) + '</span><br><span class="eta-typeahead-sug-dir">' + esc(dir) + '</span></span>' +
        '<span class="route-badge ' + ((r.company || 'KMB') === 'KMB' ? 'kmb' : 'lwb') + '">' + (r.company || 'KMB') + '</span>' +
      '</div>';
    }).join('');
    suggestions.innerHTML = histHtml + sugHtml;
    suggestions.classList.add('show');
  }

  function renderQuickBar() {
    var bar = document.getElementById('eta-quick-bar');
    bar.innerHTML = '';
    pinnedRoutes.forEach(function(r) {
      bar.innerHTML += '<div class="eta-quick-chip pinned" onclick="selectRoute(\'' + esc(r) + '\')">' +
        '<span class="chip-pin">📌</span>' + esc(r) + '</div>';
    });
    var shown = {}; pinnedRoutes.forEach(function(r) { shown[r] = true; });
    var recentCount = 0;
    searchHistory.forEach(function(r) {
      if (shown[r]) return;
      if (recentCount >= 5) return;
      shown[r] = true; recentCount++;
      bar.innerHTML += '<div class="eta-quick-chip history" onclick="selectRoute(\'' + esc(r) + '\')">' + esc(r) + '</div>';
    });
  }

  window.togglePin = function(route) {
    var idx = pinnedRoutes.indexOf(route);
    if (idx === -1) {
      pinnedRoutes.unshift(route);
    } else {
      pinnedRoutes.splice(idx, 1);
    }
    if (pinnedRoutes.length > 10) pinnedRoutes.length = 10;
    try { localStorage.setItem('eta_pinned_routes', JSON.stringify(pinnedRoutes)); } catch(e) {}
    renderQuickBar();
    var pinBtn = document.getElementById('eta-pin-btn');
    if (pinBtn) pinBtn.textContent = pinnedRoutes.indexOf(route) !== -1 ? '📌' : '📌';
    if (pinBtn) pinBtn.setAttribute('title', pinnedRoutes.indexOf(route) !== -1 ? '取消固定' : '固定此路線');
  }

  function saveToHistory(route) {
    searchHistory = searchHistory.filter(function(r) { return r !== route; });
    searchHistory.unshift(route);
    if (searchHistory.length > 10) searchHistory.length = 10;
    try { localStorage.setItem('eta_search_history', JSON.stringify(searchHistory)); } catch(e) {}
    renderQuickBar();
  }

  window.selectRoute = function(route) {
    searchInput.value = route;
    suggestions.classList.remove('show');
    saveToHistory(route);
    try { localStorage.setItem('eta_last_route', route); } catch(e) {}
    loadRoute(route);
  };

  function loadRoute(route) {
    etaContent.style.display = 'none';
    etaEmpty.style.display = 'none';
    etaStopList.innerHTML = '';
    for (var i = 0; i < 5; i++) {
      etaStopList.innerHTML += '<div class="eta-skeleton-row"><div class="skeleton eta-skeleton-seq"></div><div class="skeleton eta-skeleton-name"></div><div class="skeleton eta-skeleton-eta"></div></div>';
    }
    etaContent.style.display = '';

    currentRoute = route;
    currentBound = 'O';

    var routeData = allRoutes.filter(function(r) { return r.route === route; });
    if (routeData.length === 0) return;

    var boundO = routeData.filter(function(r) { return r.bound === 'O'; })[0];
    var boundI = routeData.filter(function(r) { return r.bound === 'I'; })[0];

    var dirHtml = '';
    if (boundO) {
      dirHtml += '<button class="eta-dir-btn active" data-bound="O" onclick="switchDirection(\'O\')">O 往 ' + esc(boundO.dest_tc || '') + '</button>';
    }
    if (boundI) {
      dirHtml += '<button class="eta-dir-btn" data-bound="I" onclick="switchDirection(\'I\')">I 往 ' + esc(boundI.dest_tc || '') + '</button>';
    }
    etaDirToggle.innerHTML = dirHtml;

    var isKMB = routeData[0].company !== 'LWB';
    var isPinned = pinnedRoutes.indexOf(route) !== -1;
    etaRouteNumber.innerHTML = esc(route) + ' <span class="route-badge ' + (isKMB ? 'kmb' : 'lwb') + '">' + (isKMB ? 'KMB' : 'LWB') + '</span>' +
      ' <span id="eta-pin-btn" class="eta-pin-btn" onclick="togglePin(\'' + esc(route) + '\')" title="' + (isPinned ? '取消固定' : '固定此路線') + '">' + (isPinned ? '📌' : '📌') + '</span>';

    var dirText = '';
    if (boundO) dirText = esc((boundO.orig_tc || '') + ' → ' + (boundO.dest_tc || ''));
    etaRouteDir.textContent = dirText;
    var pinBtn = document.getElementById('eta-pin-btn');
    if (pinBtn) pinBtn.setAttribute('onclick', 'togglePin(\'' + esc(route) + '\')');

    fetchETA(route, currentBound);
    startRefreshTimer(route);
    updateTrackLink();
  }

  window.switchDirection = function(bound) {
    if (bound === currentBound) return;
    currentBound = bound;
    document.querySelectorAll('.eta-dir-btn').forEach(function(b) {
      b.classList.toggle('active', b.getAttribute('data-bound') === bound);
    });
    var routeData = allRoutes.filter(function(r) { return r.route === currentRoute && r.bound === bound; });
    if (routeData.length > 0) {
      var rd = routeData[0];
      etaRouteDir.textContent = esc((rd.orig_tc || '') + ' → ' + (rd.dest_tc || ''));
    }
    etaStopList.innerHTML = '';
    for (var i = 0; i < 5; i++) {
      etaStopList.innerHTML += '<div class="eta-skeleton-row"><div class="skeleton eta-skeleton-seq"></div><div class="skeleton eta-skeleton-name"></div><div class="skeleton eta-skeleton-eta"></div></div>';
    }
    fetchETA(currentRoute, bound);
    startRefreshTimer(currentRoute);
    updateTrackLink();
  };

  function fetchETA(route, bound) {
    var routeData = allRoutes.filter(function(r) { return r.route === route && r.bound === bound; });
    if (routeData.length === 0 || !routeData[0].stops) {
      etaStopList.innerHTML = '<div style="text-align:center;padding:20px;color:var(--gray-500);">暫無車站資料</div>';
      return;
    }

    var stops = routeData[0].stops;
    etaStopsCount.textContent = LANG.t('eta_stops', { n: stops.length });

    // Use Route ETA API for all stops in one call
    var url = 'https://data.etabus.gov.hk/v1/transport/kmb/route-eta/' +
      encodeURIComponent(route) + '/1';

    fetch(url)
      .then(function(r) { return r.json(); })
      .then(function(data) {
        var allEta = (data && data.data) || [];
        // Filter by direction (dir = O or I)
        allEta = allEta.filter(function(e) { return e.dir === bound; });
        // Build map by seq (Route ETA has seq, not stop_id)
        var etaMap = {};
        allEta.forEach(function(e) {
          var seq = String(e.seq);
          if (!etaMap[seq]) etaMap[seq] = [];
          etaMap[seq].push(e);
        });

        var now = new Date();
        var h = '';
        stops.forEach(function(s, i) {
          var stopEtas = (etaMap[String(s.seq)] || []).filter(function(e) { return e.eta; });
          // Sort by eta_seq ascending
          stopEtas.sort(function(a, b) { return (a.eta_seq || 99) - (b.eta_seq || 99); });

          var etaHtml = '';
          if (stopEtas.length === 0) {
            etaHtml = '<span class="eta-stop-eta gray">' + LANG.t('eta_no_data') + '</span>';
          } else {
            var labels = [LANG.t('eta_next'), LANG.t('eta_following'), LANG.t('eta_third')];
            stopEtas.slice(0, 3).forEach(function(e, j) {
              var mins = Math.round((new Date(e.eta) - now) / 60000);
              var cls = 'green';
              var text;
              if (mins <= 0) { cls = 'red'; text = LANG.t('eta_lt_min'); }
              else { text = mins + ' ' + LANG.t('eta_min'); }
              etaHtml += '<div class="eta-stop-bus"><span class="eta-stop-label">' + labels[j] + '</span><span class="eta-stop-eta ' + cls + '">' + text + '</span></div>';
            });
          }

          h += '<div class="eta-stop-item" data-seq="' + esc(String(s.seq)) + '" data-stop-id="' + esc(s.stop_id || '') + '" data-name-tc="' + esc(s.name_tc || '') + '">' +
            '<button type="button" class="eta-stop-row eta-stop-toggle" aria-expanded="false">' +
              '<span class="eta-stop-seq">' + (i + 1) + '.</span>' +
              '<span class="eta-stop-name">' + esc(s.name_tc || '') + '</span>' +
              '<span class="eta-stop-times">' + etaHtml + '</span>' +
              '<span class="eta-stop-chevron" aria-hidden="true">▾</span>' +
            '</button>' +
            '<div class="eta-stop-detail" hidden></div>' +
          '</div>';
        });
        etaStopList.innerHTML = h;
        etaRefreshTimestamp.textContent = LANG.t('eta_just_now') + ' (' + now.toLocaleTimeString() + ')';
      })
      .catch(function() {
        etaStopList.innerHTML = '<div style="text-align:center;padding:20px;color:var(--gray-500);">⚠️ 無法取得到站時間</div>';
      });
  }

  /* ---------- stop detail panel (clickable stops) ---------- */
  var stopsMinPromise = null;
  var userLoc = null;

  function loadStopsMin() {
    if (!stopsMinPromise) {
      stopsMinPromise = fetch('data/bus-stops-min.json')
        .then(function(r) { return r.json(); })
        .catch(function() { return {}; });
    }
    return stopsMinPromise;
  }

  function haversineM(lat1, lon1, lat2, lon2) {
    var R = 6371000;
    var toRad = Math.PI / 180;
    var dLat = (lat2 - lat1) * toRad;
    var dLon = (lon2 - lon1) * toRad;
    var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(lat1 * toRad) * Math.cos(lat2 * toRad) *
            Math.sin(dLon / 2) * Math.sin(dLon / 2);
    return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  }

  function getMyStop() {
    try { return JSON.parse(localStorage.getItem('bus_my_stop') || 'null'); } catch (e) { return null; }
  }

  function setMyStop(route, bound, seq, stopId, nameTc) {
    try {
      localStorage.setItem('bus_my_stop', JSON.stringify({
        route: route, bound: bound, seq: seq, stop_id: stopId, name: nameTc
      }));
    } catch (e) {}
  }

  function askLocation(cb) {
    if (!navigator.geolocation) { cb(false); return; }
    navigator.geolocation.getCurrentPosition(function(pos) {
      userLoc = { lat: pos.coords.latitude, lng: pos.coords.longitude, acc: pos.coords.accuracy };
      cb(true);
    }, function() {
      cb(false);
    }, { enableHighAccuracy: true, timeout: 8000, maximumAge: 30000 });
  }

  function toggleStopDetail(item) {
    var btn = item.querySelector('.eta-stop-toggle');
    var panel = item.querySelector('.eta-stop-detail');
    if (!panel) return;
    var open = btn.getAttribute('aria-expanded') === 'true';
    if (open) {
      btn.setAttribute('aria-expanded', 'false');
      panel.hidden = true;
      return;
    }
    btn.setAttribute('aria-expanded', 'true');
    panel.hidden = false;
    if (panel.dataset.filled === '1') return;

    var seq = item.getAttribute('data-seq');
    var stopId = item.getAttribute('data-stop-id');
    var nameTc = item.getAttribute('data-name-tc');
    var myStop = getMyStop();
    var isMine = myStop && myStop.route === currentRoute && String(myStop.seq) === String(seq);

    loadStopsMin().then(function(stops) {
      var info = stops[stopId] || ['', '', '', ''];
      var nameEn = info[0] || '';
      var lat = parseFloat(info[1]);
      var lng = parseFloat(info[2]);
      var routesHere = info[3] ? info[3].split(',').filter(Boolean) : [];

      var distHtml = '';
      if (userLoc && !isNaN(lat) && !isNaN(lng)) {
        var d = haversineM(userLoc.lat, userLoc.lng, lat, lng);
        if (d < 1000) {
          distHtml = '<span class="eta-detail-chip">' + LANG.t('track_distance', { n: Math.round(d) }) + '</span>';
        }
      } else if (!isNaN(lat) && !isNaN(lng)) {
        distHtml = '<button type="button" class="eta-detail-chip eta-detail-locate" data-action="locate">' + LANG.t('track_locate') + '</button>';
      }

      var routesHtml = routesHere.length
        ? '<div class="eta-detail-section"><div class="eta-detail-label">' + LANG.t('track_stop_routes') + '</div>' +
          '<div class="eta-detail-routes">' + routesHere.slice(0, 20).map(function(r) {
            return '<a class="eta-route-chip" href="eta.html?route=' + encodeURIComponent(r) + '">' + esc(r) + '</a>';
          }).join('') + (routesHere.length > 20 ? '<span class="eta-route-chip more">+' + (routesHere.length - 20) + '</span>' : '') +
          '</div></div>'
        : '';

      var navUrl = (!isNaN(lat) && !isNaN(lng))
        ? 'https://www.google.com/maps/dir/?api=1&destination=' + lat + ',' + lng
        : 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(nameTc + ' 巴士站 香港');

      var actions =
        '<div class="eta-detail-actions">' +
          '<button type="button" class="eta-detail-btn' + (isMine ? ' is-mine' : '') + '" data-action="set-stop">' +
            (isMine ? '⭐ ' + LANG.t('track_my_stop') : LANG.t('track_set_stop')) + '</button>' +
          '<a class="eta-detail-btn" href="' + navUrl + '" target="_blank" rel="noopener">' + LANG.t('track_navigate') + '</a>' +
          '<a class="eta-detail-btn primary" href="track.html?route=' + encodeURIComponent(currentRoute || '') + '&bound=' + encodeURIComponent(currentBound || 'O') + '&seq=' + encodeURIComponent(seq) + '">' + LANG.t('track_view_track') + '</a>' +
        '</div>';

      panel.innerHTML =
        (nameEn ? '<div class="eta-detail-en">' + esc(nameEn) + '</div>' : '') +
        (distHtml ? '<div class="eta-detail-chips">' + distHtml + '</div>' : '') +
        routesHtml +
        actions;
      panel.dataset.filled = '1';
      panel.dataset.seq = seq;
      panel.dataset.name = nameTc;

      var locateBtn = panel.querySelector('[data-action="locate"]');
      if (locateBtn) {
        locateBtn.addEventListener('click', function() {
          var lb = this;
          lb.textContent = LANG.t('track_locating');
          askLocation(function(ok) {
            if (!ok) { lb.textContent = LANG.t('track_loc_denied'); return; }
            panel.dataset.filled = '0';
            panel.hidden = true;
            var b = item.querySelector('.eta-stop-toggle');
            if (b) b.setAttribute('aria-expanded', 'false');
            toggleStopDetail(item);
          });
        });
      }

      panel.querySelector('[data-action="set-stop"]').addEventListener('click', function() {
        var s = this;
        var wasMine = s.classList.contains('is-mine');
        if (wasMine) {
          try { localStorage.removeItem('bus_my_stop'); } catch (e) {}
          s.classList.remove('is-mine');
          s.textContent = LANG.t('track_set_stop');
        } else {
          setMyStop(currentRoute, currentBound, seq, stopId, nameTc);
          s.classList.add('is-mine');
          s.textContent = '⭐ ' + LANG.t('track_my_stop');
        }
      });
    });
  }

  if (etaStopList) {
    etaStopList.addEventListener('click', function(e) {
      var item = e.target.closest('.eta-stop-item');
      if (!item) return;
      toggleStopDetail(item);
    });
  }

  function updateTrackLink() {
    var seg = document.getElementById('eta-seg-track');
    if (!seg) return;
    if (currentRoute) {
      seg.href = 'track.html?route=' + encodeURIComponent(currentRoute) + '&bound=' + encodeURIComponent(currentBound || 'O');
    } else {
      seg.href = 'track.html';
    }
  }

  function startRefreshTimer(route) {
    if (refreshTimer) clearInterval(refreshTimer);
    refreshTimer = setInterval(function() {
      if (currentRoute) fetchETA(currentRoute, currentBound);
    }, 10000);
  }

  searchInput.addEventListener('input', function() { handleSearchInput(this.value); });
  searchInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      var first = suggestions.querySelector('.eta-typeahead-sug');
      if (first) { first.click(); return; }
      var val = this.value.trim();
      if (val) selectRoute(val.toUpperCase());
    }
  });
  clearBtn.addEventListener('click', function() {
    searchInput.value = ''; clearBtn.style.display = 'none';
    suggestions.classList.remove('show');
    if (refreshTimer) clearInterval(refreshTimer);
    etaContent.style.display = 'none'; etaEmpty.style.display = '';
  });
  searchInput.addEventListener('focus', function() {
    if (this.value.trim()) { handleSearchInput(this.value); } else { showHistory(); }
  });
  searchInput.addEventListener('blur', function() { setTimeout(function() { suggestions.classList.remove('show'); }, 200); });
  document.getElementById('eta-manual-refresh').addEventListener('click', function() {
    if (currentRoute) fetchETA(currentRoute, currentBound);
  });
  document.addEventListener('click', function(e) {
    if (!e.target.closest('.eta-typeahead')) suggestions.classList.remove('show');
  });

  fetch('data/bus-routes-index.json').then(function(r) { return r.json(); }).then(function(data) {
    allRoutes = data;
    renderQuickBar();
    var params = new URLSearchParams(window.location.search);
    var routeParam = params.get('route') || localStorage.getItem('eta_last_route');
    if (routeParam && allRoutes.some(function(r) { return r.route === routeParam; })) {
      searchInput.value = routeParam;
      loadRoute(routeParam);
      var boundParam = params.get('bound');
      if (boundParam && (boundParam === 'O' || boundParam === 'I')) {
        setTimeout(function() { switchDirection(boundParam); }, 500);
      }
    }
  }).catch(function() {
    etaEmpty.innerHTML = '<div style="padding:40px;color:var(--red);">⚠️ 無法載入路線資料</div>';
  });

  document.addEventListener('langchange', function() {
    if (currentRoute) fetchETA(currentRoute, currentBound);
  });
})();
</script>

    window.addEventListener('load', function() {
      navigator.serviceWorker.register('sw.js').catch(function() {});
    });

  <script>
  (function () {
    var page = (location.pathname.split('/').pop() || 'index.html').toLowerCase();
    var map = { 'index.html': 'home', 'routes.html': 'routes', 'eta.html': 'eta', 'track.html': 'track' };
    var current = map[page] || 'more';
    document.body.classList.add('has-tabbar');

    var items = document.querySelectorAll('.tabbar-item');
    for (var i = 0; i < items.length; i++) {
      if (items[i].getAttribute('data-tab') === current) items[i].setAttribute('aria-current', 'page');
    }

    var moreBtn = document.getElementById('tabbar-more');
    var sheet = document.getElementById('tabbar-sheet');
    if (!moreBtn || !sheet) return;

    function closeSheet() {
      sheet.hidden = true;
      moreBtn.setAttribute('aria-expanded', 'false');
    }
    moreBtn.addEventListener('click', function () {
      var open = sheet.hidden;
      sheet.hidden = !open;
      moreBtn.setAttribute('aria-expanded', String(open));
      if (open) { var f = sheet.querySelector('a'); if (f) f.focus(); }
    });
    document.addEventListener('click', function (e) {
      if (!sheet.hidden && !sheet.contains(e.target) && !moreBtn.contains(e.target)) closeSheet();
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { closeSheet(); moreBtn.focus(); }
    });
  })();
  </script>
