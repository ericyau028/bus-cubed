  function getRegion(routeNum) {
    return REGION_MAP[routeNum] || 'nt';
  }

  function esc(s) {
    if (!s) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  function buildRouteGrid() {
    var grid = document.getElementById('route-grid');
    var routes = filteredRoutes;

    if (routes.length === 0) {
      grid.innerHTML = '<div style="text-align:center;padding:40px;color:var(--gray-500);">' + LANG.t('no_results') + '</div>';
      document.getElementById('route-count').textContent = '';
      return;
    }

    var uniqueRoutes = {};
    routes.forEach(function(r) {
      if (!uniqueRoutes[r.route]) {
        uniqueRoutes[r.route] = { route: r.route, bounds: {}, company: r.company, stops: {} };
      }
      uniqueRoutes[r.route].bounds[r.bound] = r;
      uniqueRoutes[r.route].company = r.company || 'KMB';
    });

    var routeList = Object.keys(uniqueRoutes).sort(function(a, b) {
      var aNum = parseInt(a), bNum = parseInt(b);
      if (!isNaN(aNum) && !isNaN(bNum)) return aNum - bNum;
      return a.localeCompare(b);
    }).map(function(k) { return uniqueRoutes[k]; });

    document.getElementById('route-count').textContent = LANG.t('routes_total', { n: routeList.length });

    var h = '';
    routeList.forEach(function(r) {
      var boundO = r.bounds['O'];
      var boundI = r.bounds['I'];
      var dirText = '';
      if (boundO && boundI) {
        dirText = esc((boundO.orig_tc || '') + ' → ' + (boundO.dest_tc || '')) + '<br>' +
                  esc((boundI.orig_tc || '') + ' → ' + (boundI.dest_tc || ''));
      } else if (boundO) {
        dirText = esc((boundO.orig_tc || '') + ' → ' + (boundO.dest_tc || ''));
      } else if (boundI) {
        dirText = esc((boundI.orig_tc || '') + ' → ' + (boundI.dest_tc || ''));
      }
      var isKMB = r.company !== 'LWB';

      var stopCountO = (boundO && boundO.stops) ? boundO.stops.length : 0;
      var stopCountI = (boundI && boundI.stops) ? boundI.stops.length : 0;

      h += '<div class="route-card" data-route="' + esc(r.route) + '">' +
        '<div class="route-card-header" onclick="this.closest(\'.route-card\').classList.toggle(\'expanded\')">' +
          '<span class="route-card-number">' + esc(r.route) + '</span>' +
          '<span class="route-badge ' + (isKMB ? 'kmb' : 'lwb') + '">' + (isKMB ? 'KMB' : 'LWB') + '</span>' +
        '</div>' +
        '<div class="route-card-direction">' + dirText + '</div>' +
        '<div class="route-card-body">' +
          '<div class="route-direction-toggle">' +
            (boundO ? '<button class="route-dir-btn active" data-bound="O" onclick="event.stopPropagation();showRouteStops(this,\'' + esc(r.route) + '\',\'O\')">O 往 ' + esc(boundO.dest_tc || '') + '</button>' : '') +
            (boundI ? '<button class="route-dir-btn" data-bound="I" onclick="event.stopPropagation();showRouteStops(this,\'' + esc(r.route) + '\',\'I\')">I 往 ' + esc(boundI.dest_tc || '') + '</button>' : '') +
          '</div>' +
          '<div class="route-stops" id="route-stops-' + esc(r.route) + '">' +
            '<div style="padding:8px 0;color:var(--gray-400);font-size:0.8rem;">點擊方向按鈕顯示車站</div>' +
          '</div>' +
        '</div>' +
        '<div class="route-card-footer">' +
          '<a href="eta.html?route=' + esc(r.route) + '&bound=O" class="route-eta-link" data-i18n="view_eta">⏱ 查看到站</a>' +
        '</div>' +
      '</div>';
    });
    grid.innerHTML = h;
  }

  window.showRouteStops = function(btn, route, bound) {
    var container = document.getElementById('route-stops-' + route);
    if (!container) return;

    var parent = btn.closest('.route-card');
    parent.querySelectorAll('.route-dir-btn').forEach(function(b) { b.classList.remove('active'); });
    btn.classList.add('active');

    var routeData = allRoutes.filter(function(r) { return r.route === route && r.bound === bound; });
    if (routeData.length === 0 || !routeData[0].stops) {
      container.innerHTML = '<div style="padding:8px 0;color:var(--gray-400);font-size:0.8rem;">無車站資料</div>';
      return;
    }
    var stops = routeData[0].stops;
    var h = '';
    stops.forEach(function(s, i) {
      h += '<div class="route-stop-row">' +
        '<span class="route-stop-seq">' + (i + 1) + '.</span>' +
        '<span class="route-stop-name">' + esc(s.name_tc || '') + '</span>' +
      '</div>';
    });
    container.innerHTML = h;
  };

  function applyFilter() {
    var searchActive = window._searchActive || false;
    if (!searchActive) {
      if (currentRegion === 'all') {
        filteredRoutes = allRoutes;
      } else {
        filteredRoutes = allRoutes.filter(function(r) {
          return getRegion(r.route) === currentRegion;
        });
      }
    }
    buildRouteGrid();
  }

  // Region filter pills
  document.getElementById('filter-pills').addEventListener('click', function(e) {
    var pill = e.target.closest('.filter-pill');
    if (!pill) return;
    document.querySelectorAll('.filter-pill').forEach(function(p) { p.classList.remove('active'); });
    pill.classList.add('active');
    currentRegion = pill.getAttribute('data-region');
    window._searchActive = false;
    applyFilter();
  });

  fetch('data/bus-routes-index.json').then(function(r) { return r.json(); }).then(function(data) {
    allRoutes = data;
    filteredRoutes = data;
    buildRouteGrid();

    if (typeof window.createSearch === 'function') {
      window.createSearch({
        container: '#search-container',
        data: data,
        fields: ['route', 'orig_tc', 'dest_tc', 'orig_en', 'dest_en'],
        placeholder: '搜尋路線編號、起點、終點...',
        onFilter: function(fd) {
          if (fd.length === data.length) {
            window._searchActive = false;
            applyFilter();
          } else {
            window._searchActive = true;
            filteredRoutes = fd;
            buildRouteGrid();
          }
        }
      });
    }

    document.getElementById('route-count').textContent = LANG.t('routes_total', { n: Object.keys(data.reduce(function(a,r){a[r.route]=1;return a;},{})).length });
  }).catch(function() {
    document.getElementById('route-grid').innerHTML = '<div class="error">⚠️ 載入路線資料失敗</div>';
  });
